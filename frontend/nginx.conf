# Serves the built frontend and proxies /api to the backend, so the browser
# only ever talks to one origin and the session cookie works without CORS.
#
# TLS, HSTS and Content-Security-Policy are NOT here: this container sits
# behind Caddy (docs/security.md), and a header set in two places is a header
# nobody can reason about. What is set below is what stays correct either way.

# WebSocket upgrades only pass through if Connection is set accordingly — and
# only when the client actually asked for one, hence the map instead of a fixed
# header. conf.d/*.conf is included in the http context, so this belongs here.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nothing here accepts uploads.
    client_max_body_size 1m;

    # Version numbers are free information for whoever is scanning.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite writes a content hash into every asset name, so these can be cached
    # forever. index.html must not be — it is what points at the new hashes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        # Docker's embedded DNS, and the upstream through a variable on
        # purpose: with a literal name nginx resolves it once at startup and
        # refuses to start at all while the backend is down — one restart of
        # the backend would take the frontend with it. Through a variable the
        # name is resolved per request, so a backend that is briefly away is a
        # 502 for that request and nothing more.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream "http://backend:8000";
        proxy_pass $upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The backend reads this when TRUST_PROXY_HEADER=true. It is set here,
        # never passed through: a client-supplied value would turn the login
        # rate limit into decoration.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The web terminal is a WebSocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;

        proxy_buffering off;
    }

    # Client-side routing: /planner and /servers are React Router paths, not
    # files, so anything that is not on disk gets index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
